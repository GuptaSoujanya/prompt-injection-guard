[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-guard"
version = "0.3.1"
description = "Security and red-teaming evaluation harness for LLM prompt injection and safety alignment."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "158287001+GuptaSoujanya@users.noreply.github.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[project.scripts]
prompt-guard = "prompt_guard.cli:main"
